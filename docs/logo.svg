<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Saryu: a rising sun over a river">
  <title>Saryu</title>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c45c"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6d82"/>
      <stop offset="1" stop-color="#17a0b8"/>
    </linearGradient>
  </defs>
  <!-- a sun standing above its own reflection -->
  <g>
    <circle cx="48" cy="38" r="15" fill="url(#sun)"/>
    <g stroke="url(#sun)" stroke-width="3.4" stroke-linecap="round">
      <line x1="48" y1="9" x2="48" y2="16"/>
      <line x1="27.5" y1="17.5" x2="32.4" y2="22.4"/>
      <line x1="68.5" y1="17.5" x2="63.6" y2="22.4"/>
      <line x1="19" y1="38" x2="26" y2="38"/>
      <line x1="77" y1="38" x2="70" y2="38"/>
      <line x1="27.5" y1="58.5" x2="32.4" y2="53.6"/>
      <line x1="68.5" y1="58.5" x2="63.6" y2="53.6"/>
    </g>
  </g>
  <!-- the river: two currents that do not run the same way -->
  <g fill="none" stroke="url(#water)" stroke-linecap="round">
    <path d="M10 68 C 24 58, 34 78, 48 68 S 72 58, 86 68" stroke-width="7"/>
    <path d="M17 82 C 29 74, 38 90, 48 82 S 68 74, 79 82" stroke-width="5" opacity="0.6"/>
  </g>
</svg>
